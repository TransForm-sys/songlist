# 1Panel / Nginx 反向代理配置参考
#
# 用法（二选一）：
#  A. 全部交给 Node（最简单，推荐）—— 把整站反向代理到 127.0.0.1:5181，
#     静态资源、/api、/uploads、/admin 都由 Node 处理。
#  B. 静态资源交给 Nginx，只有 /api 和 /uploads 走代理（性能略好，但配置要跟
#     构建产物保持一致，改起来麻烦）。
#
# 1Panel 里对应「网站 → 反向代理」，把下面 location 的内容粘进去即可；
# 或者直接改 /opt/1panel/apps/openresty/openresty/conf/conf.d/<站点>.conf。
#
# 换域名时：新建一个反向代理站点即可，应用侧不用改任何配置。

# ---------- 1Panel 里生成的站点配置长这样（整站反代） ----------
# 路径：/opt/1panel/apps/openresty/openresty/conf/conf.d/<你的域名>.conf
# 证书路径是 1Panel 自己管理的，申请/上传证书后它会自动写进去，不用手抄。
#
# server {
#     listen 80;
#     listen 443 ssl;
#     http2 on;
#     server_name songlist.example.com www.songlist.example.com;
#
#     ssl_certificate     /opt/1panel/www/sites/songlist.example.com/ssl/fullchain.pem;
#     ssl_certificate_key /opt/1panel/www/sites/songlist.example.com/ssl/privkey.pem;
#
#     access_log /opt/1panel/www/sites/songlist.example.com/log/access.log;
#     error_log  /opt/1panel/www/sites/songlist.example.com/log/error.log;
#
#     # ★ 必须加：头像/封面是 base64 上传的，3MB 图片编码后约 4MB
#     client_max_body_size 12m;
#
#     location / {
#         proxy_pass http://127.0.0.1:5181;
#         proxy_http_version 1.1;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # ★ 登录限流靠它
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_read_timeout 120s;   # ★ 批量导入几千行时别让网关先超时
#         proxy_send_timeout 120s;
#     }
#
#     # 80 端口自动跳转到 https（1Panel 开「强制 HTTPS」后会自动生成）
#     # if ($scheme = http) { return 301 https://$host$request_uri; }
# }

# ---------- 方案 A：整站反代（推荐） ----------
server {
    listen 80;
    server_name your-domain.com;
    # 1Panel 申请证书后会自动补上 443 的配置和跳转

    # 图片上传走 base64（3MB 图片编码后约 4MB），这里留足余量
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后台批量导入可能一次提交几千行，别让网关先超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 带 hash 的构建产物让浏览器长期缓存（Node 里已经带了 Cache-Control，这里冗余一层）
    location ~* /assets/.*-[A-Za-z0-9_-]{8,}\.(js|css)$ {
        proxy_pass http://127.0.0.1:5181;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后台不要被搜索引擎收录
    location = /admin {
        proxy_pass http://127.0.0.1:5181;
        proxy_set_header Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

